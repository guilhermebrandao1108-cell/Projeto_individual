name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analise:
    name: Análise (estatística)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analise
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: analise/requirements.txt
      - run: pip install -r requirements.txt
      # The raw-data audit (test_auditoria.py) is skipped here: the 77 MB of official ZIPs are not in the repository.
      - run: python -m unittest discover -s tests -v

  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sistema/backend
    env:
      DATABASE_URL: sqlite:///./ci.db
      SECRET_KEY: ci-only-secret-key-with-at-least-32-bytes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: sistema/backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Migrations apply and match the models
        run: |
          alembic upgrade head
          alembic check
      - run: python -m pytest -q
      - name: Demo data can be generated
        run: python -m app.seed --reset

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sistema/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sistema/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
