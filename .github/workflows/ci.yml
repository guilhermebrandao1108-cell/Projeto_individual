name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analise:
    name: Análise (estatística)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analise
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: analise/requirements.txt
      - run: pip install -r requirements.txt
      # The raw-data audit (test_auditoria.py) is skipped here: the 77 MB of official ZIPs are not in the repository.
      - run: python -m unittest discover -s tests -v

  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sistema/backend
    env:
      DATABASE_URL: sqlite:///./ci.db
      SECRET_KEY: ci-only-secret-key-with-at-least-32-bytes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: sistema/backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Migrations apply and match the models
        run: |
          alembic upgrade head
          alembic check
      - run: python -m pytest -q
      - name: Demo data can be generated
        run: python -m app.seed --reset

  backend-postgres:
    name: Backend no PostgreSQL 17
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chamados
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: sistema/backend
    env:
      # The same database for migrations and tests: each test starts from an empty schema.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/chamados
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/chamados
      SECRET_KEY: ci-only-secret-key-with-at-least-32-bytes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: sistema/backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Migrations apply and match the models
        run: |
          alembic upgrade head
          alembic check
      - run: python -m pytest -q
      - name: Demo data can be generated
        run: python -m app.seed --reset

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sistema/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sistema/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: Ponta a ponta (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, backend-postgres, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: sistema/backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sistema/frontend/package-lock.json
      - run: pip install -r requirements.txt
        working-directory: sistema/backend
      - run: npm ci
        working-directory: sistema/frontend
      - run: npx playwright install --with-deps chromium
        working-directory: sistema/frontend
      # Playwright starts a freshly seeded API and the Vite dev server itself (see playwright.config.ts).
      - run: npm run e2e
        working-directory: sistema/frontend
        env:
          PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: sistema/frontend/playwright-report
          retention-days: 7
